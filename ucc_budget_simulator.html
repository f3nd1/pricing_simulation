<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCC Course Budget Simulator</title>
<style>
:root{
  --blue-900:#1e3a8a;--blue-700:#1d4ed8;--blue-600:#2563eb;--blue-400:#60a5fa;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --green-800:#166534;--green-100:#bbf7d0;--green-50:#f0fdf4;
  --red-700:#b91c1c;--red-100:#fecaca;--red-50:#fff5f5;
  --amber-800:#92400e;--amber-100:#fde68a;
  --gray-900:#0f1724;--gray-700:#2d3748;--gray-500:#64748b;--gray-300:#cbd5e1;--gray-200:#e2e8f0;--gray-100:#f1f5f9;--gray-50:#f8fafc;
  --surface-0:#eef0f4;--surface-1:#f5f6f9;--surface-2:#ffffff;
  --border:#dde1e9;--border-strong:#b0b8c8;--border-accent:#3b6ef0;
  --text-primary:var(--gray-900);--text-secondary:var(--gray-700);--text-muted:var(--gray-500);
  --text-success:var(--green-800);--text-danger:var(--red-700);--text-warning:var(--amber-800);--text-accent:var(--blue-600);
  --bg-success:var(--green-100);--bg-danger:var(--red-100);--bg-warning:var(--amber-100);--bg-accent:var(--blue-100);
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 16px rgba(0,0,0,.11);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
*{box-sizing:border-box;margin:0;padding:0}
input,select,button,textarea{font-family:var(--font);font-size:inherit}
input[type=number],input[type=text],input[type=password]{
  background:var(--surface-1);border:1px solid var(--border);border-radius:6px;
  color:var(--text-primary);padding:4px 8px;transition:border-color .15s}
input[type=number]:focus,input[type=text]:focus,input[type=password]:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--blue-600)}
select{background:var(--surface-1);border:1px solid var(--border);border-radius:6px;
  color:var(--text-primary);padding:5px 8px;cursor:pointer}
button{background:var(--surface-1);border:1px solid var(--border);border-radius:7px;
  color:var(--text-primary);cursor:pointer;padding:5px 12px;transition:background .15s}
button:hover{background:var(--surface-0)}

/* Layout */
.wrap{background:var(--surface-0);min-height:100vh;font-family:var(--font);font-size:13px;color:var(--text-primary)}
.hdr{background:linear-gradient(135deg,var(--blue-900) 0%,var(--blue-700) 100%);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr-brand{display:flex;flex-direction:column;gap:1px}
.hdr-label{font-size:10px;font-weight:500;color:var(--blue-400);text-transform:uppercase;letter-spacing:.1em}
.hdr-title{font-size:17px;font-weight:600;color:#fff}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hdr-btn{font-size:12px;padding:5px 11px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:7px;color:#fff;cursor:pointer;font-weight:500;transition:background .15s}
.hdr-btn:hover{background:rgba(255,255,255,.25)}
.hdr-btn.primary{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6)}

.subhdr{background:var(--surface-2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.course-label{font-size:11px;font-weight:500;color:var(--text-muted);white-space:nowrap}
#coursesel{font-size:12px;min-width:300px}
.kpi-bar{display:flex;gap:20px;margin-left:auto;align-items:stretch;flex-wrap:wrap}
.kpi{text-align:right;padding:0 4px}
.kpi-lbl{font-size:9px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.kpi-val{font-size:18px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi-div{width:1px;background:var(--border)}

.body{display:flex;gap:0;min-height:calc(100vh - 120px)}
.lp{width:252px;flex-shrink:0;background:var(--surface-2);border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.rp{flex:1;min-width:0;padding:14px 16px;overflow-x:hidden}

/* Left panel sections */
.lp-sec{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.lp-sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;background:var(--surface-1);cursor:pointer;user-select:none}
.lp-sec-hdr:hover{background:var(--surface-0)}
.lp-sec-title{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.lp-sec-dot{width:7px;height:7px;border-radius:50%}
.lp-sec-caret{font-size:11px;color:var(--text-muted);transition:transform .2s}
.lp-sec-caret.open{transform:rotate(90deg)}
.lp-sec-body{padding:8px 11px;display:flex;flex-direction:column;gap:0}
.lp-sec-body.hidden{display:none}

/* Input rows */
.ni{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:.5px solid var(--border)}
.ni:last-child{border-bottom:none}
.nilbl{font-size:12px;color:var(--text-secondary)}
.nipfx{font-size:11px;color:var(--text-muted)}
.nigrp{display:flex;align-items:center;gap:3px}

/* Course param rows */
.cprow{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:.5px solid var(--border);font-size:12px}
.cprow:last-child{border-bottom:none}
.cprow-lbl{color:var(--text-muted)}
.cprow-val{font-weight:500;color:var(--text-primary)}

/* Overhead rows */
.ohrow{display:flex;align-items:center;gap:4px;padding:3px 0;border-bottom:.5px solid var(--border)}
.ohrow:last-child{border-bottom:none}
.ohlbl{font-size:11px;color:var(--text-secondary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Content cards */
.card{background:var(--surface-2);border-radius:var(--radius-md);border:1px solid var(--border);padding:14px;box-shadow:var(--shadow-sm);margin-bottom:10px}
.card:last-child{margin-bottom:0}
.card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.card-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}

/* KPI cards in overview */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-sm);text-align:center}
.kpi-card-lbl{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.kpi-card-val{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi-card-sub{font-size:11px;color:var(--text-muted);margin-top:3px}

/* Data rows */
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 0;border-bottom:.5px solid var(--border)}
.row:last-child{border-bottom:none}
.row.total{border-top:1.5px solid var(--border-strong);border-bottom:none;margin-top:4px;padding-top:6px}
.rl{font-size:12px;color:var(--text-secondary)}
.rn{font-size:10px;color:var(--text-muted)}
.rv{font-size:13px}
.rv.ok{color:var(--text-success)}
.rv.bad{color:var(--text-danger)}
.rv.acc{color:var(--text-accent);font-weight:500}
.rv.bold{font-weight:500}

/* Tabs */
.tabs-wrap{margin-bottom:14px;border-bottom:2px solid var(--border)}
.tabs{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:8px 14px;border-radius:7px 7px 0 0;font-size:12px;background:transparent;color:var(--text-muted);border:none;cursor:pointer;white-space:nowrap;margin-bottom:-2px;font-weight:500;transition:color .15s}
.tab:hover{color:var(--text-primary)}
.tab.on{background:var(--surface-2);color:var(--blue-600);font-weight:700;border:2px solid var(--border);border-bottom:2px solid var(--surface-2)}

/* Sensitivity table */
.stbl{border-collapse:separate;border-spacing:3px}
.stbl th{padding:6px 16px;background:var(--surface-1);border-radius:4px;font-size:11px;font-weight:500;color:var(--text-secondary);text-align:center;border:.5px solid var(--border)}
.stbl td.drow{padding:6px 16px;background:var(--surface-1);border-radius:4px;font-size:12px;font-weight:500;color:var(--text-secondary);text-align:center;border:.5px solid var(--border)}
.stbl td.scell{padding:9px 16px;border-radius:4px;font-size:15px;font-weight:500;text-align:center}
.sleg{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.svbox{display:inline-block;width:12px;height:12px;border-radius:3px;border:.5px solid var(--border-strong);vertical-align:middle;margin-right:4px}

/* Compare table */
.cptbl{width:100%;border-collapse:collapse;font-size:12px}
.cptbl th{padding:6px 8px;text-align:left;border-bottom:.5px solid var(--border-strong);color:var(--text-muted);font-weight:500;font-size:10px;text-transform:uppercase;white-space:nowrap}
.cptbl td{padding:5px 8px;border-bottom:.5px solid var(--border)}
.qcmp{margin-top:12px;background:var(--surface-1);border-radius:10px;padding:12px}
.qcmpg{display:grid;grid-template-columns:1fr 1fr;gap:6px;color:var(--text-secondary);margin-top:8px;font-size:12px}

/* Price list table */
.pltbl{width:100%;border-collapse:collapse;font-size:12px}
.pltbl th{padding:7px 8px;text-align:left;border-bottom:.5px solid var(--border-strong);color:var(--text-muted);font-weight:500;font-size:10px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;background:var(--surface-2);z-index:1}
.pltbl td{padding:3px 6px;border-bottom:.5px solid var(--border);vertical-align:middle}
.pltbl tr:hover td{background:var(--surface-1)}
.pltbl td.cat{font-size:10px;color:var(--text-muted);white-space:nowrap}
.plinp{width:68px;text-align:right;font-size:11px;padding:2px 5px;background:var(--surface-1);border:1px solid var(--border);border-radius:5px;color:var(--text-primary)}
.plinp:focus{outline:none;border-color:var(--blue-600)}
.plinp.sm{width:52px}
.pltbl td.tot{font-size:12px;font-weight:600;color:var(--text-accent);text-align:right;white-space:nowrap}

/* Fee calc */
.schrad{display:flex;gap:10px;margin:6px 0;flex-wrap:wrap}
.schrad label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);cursor:pointer}
.fcsum{border-radius:12px;padding:16px;margin-top:12px;text-align:center}
.instrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:.5px solid var(--border)}

/* Variance cards */
.vrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:.5px solid var(--border)}
.vrow:last-child{border-bottom:none}
.vcard{margin-top:10px;border-radius:10px;padding:12px;text-align:center}

/* Grid layouts */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Scenario name input in header */
#sName{font-size:12px;width:130px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:6px;color:#fff;padding:5px 10px}
#sName::placeholder{color:rgba(255,255,255,.6)}

/* AI Chat */
.ai-panel{
  position:fixed;right:16px;bottom:16px;width:360px;max-height:520px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);display:flex;flex-direction:column;z-index:1000;
  transform:translateY(16px) scale(.97);opacity:0;pointer-events:none;transition:all .2s ease}
.ai-panel.open{transform:none;opacity:1;pointer-events:all}
.ai-float{
  position:fixed;right:16px;bottom:16px;width:50px;height:50px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue-900),var(--blue-600));border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(37,99,235,.4);z-index:999;font-size:20px;
  transition:transform .2s,box-shadow .2s;color:#fff}
.ai-float:hover{transform:scale(1.07);box-shadow:0 6px 22px rgba(37,99,235,.5)}
.ai-float.hidden{display:none}
.ai-phdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.ai-phdr-title{display:flex;align-items:center;gap:8px}
.ai-model-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--blue-100);color:var(--blue-700)}
.ai-settings-panel{padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface-1);flex-shrink:0}
.ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.ai-msg{display:flex}
.ai-msg.user{justify-content:flex-end}
.ai-bubble{max-width:86%;padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.55}
.ai-msg.user .ai-bubble{background:var(--blue-600);color:#fff;border-radius:12px 12px 3px 12px}
.ai-msg.assistant .ai-bubble{background:var(--surface-1);color:var(--text-primary);border-radius:12px 12px 12px 3px;border:1px solid var(--border)}
.ai-empty{padding:16px 12px;text-align:center;color:var(--text-muted);font-size:12px}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.ai-chip{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--blue-50);color:var(--blue-700);border:1px solid var(--blue-100);cursor:pointer;transition:background .15s}
.ai-chip:hover{background:var(--blue-100)}
.ai-input-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;align-items:center}
.ai-send-btn{padding:7px 14px;background:var(--blue-600);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:background .15s;flex-shrink:0}
.ai-send-btn:hover{background:var(--blue-700)}
.ai-send-btn:disabled{background:var(--gray-300);cursor:not-allowed}
.ai-thinking{display:flex;gap:4px;align-items:center;padding:8px 12px}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:bounce .8s infinite}
.ai-dot:nth-child(2){animation-delay:.15s}
.ai-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px}

/* Tablet ≤ 900px */
@media(max-width:900px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr 1fr}
  .lp{width:220px}
  #coursesel{min-width:0;flex:1}
}
/* Mobile ≤ 640px */
@media(max-width:640px){
  .hdr{padding:10px 12px;gap:8px}
  .hdr-title{font-size:15px}
  .subhdr{flex-direction:column;align-items:stretch;padding:10px 12px;gap:8px}
  .kpi-bar{margin-left:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .kpi-div{display:none}
  .kpi{text-align:left;padding:0}
  .kpi-val{font-size:15px}
  .body{flex-direction:column}
  .lp{width:100%;border-right:none;border-bottom:1px solid var(--border);padding:10px 12px}
  .rp{padding:10px 12px}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
  .tab{padding:7px 10px;font-size:11px}
  .card{padding:12px}
  .kpi-card-val{font-size:18px}
  .plinp{width:56px}
  .plinp.sm{width:44px}
  #coursesel{width:100%}
  select#fcCoursesel{width:100%}
  .ai-panel{width:calc(100vw - 24px);right:12px;bottom:12px;max-height:65vh}
  .ai-float{right:12px;bottom:12px;width:44px;height:44px;font-size:17px}
  .qcmpg{grid-template-columns:1fr}
  .hdr-actions{gap:4px}
}
</style>
</head>

  }catch(e){}

function loadFromStorage(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d.prices&&d.prices.length===COURSES.length){
      d.prices.forEach((p,i)=>{
        COURSES[i].fee=p.fee;COURSES[i].mat=p.mat;COURSES[i].exam=p.exam;COURSES[i].admin=p.admin;
        if(p.hrs!==undefined)COURSES[i].hrs=p.hrs;
        if(p.mo!==undefined)COURSES[i].mo=p.mo;
      });
    }
    const nums=["ci","disc","agent","uni","tf","cp","plan","act","aDisc","aAgent","aUni","ulecMgmt","fcCi","fcSchol"];
    nums.forEach(k=>{if(d[k]!==undefined)ST[k]=d[k];});
    if(Array.isArray(d.saved))ST.saved=d.saved;
    if(d.tab)ST.tab=d.tab;
    if(Array.isArray(d.oh)&&d.oh.length===ST.oh.length)ST.oh=d.oh;
    if(d.aiKey)ST.aiKey=d.aiKey;
    if(d.aiModel)ST.aiModel=d.aiModel;
    if(Array.isArray(d.aiMessages))ST.aiMessages=d.aiMessages;
    if(d.lpSections)ST.lpSections={...ST.lpSections,...d.lpSections};
  }catch(e){}
}

function importData(file){

  reader.onload=e=>{
    try{

      if(d.prices&&d.prices.length===COURSES.length){
        d.prices.forEach((p,i)=>{

        });
      }
      const nums=["ci","disc","agent","uni","tf","cp","plan","act","aDisc","aAgent","aUni","ulecMgmt","fcCi","fcSchol"];

function calc(st){
  const c=COURSES[st.ci];
  const totalFee=c.fee+c.mat+c.exam+c.admin;
  const otherFees=c.mat+c.exam+c.admin;
  const teachCost=st.tf*c.hrs*(st.cp/100);
  const fixedCostMonthly=st.oh.reduce((s,o)=>s+(Number(o.cost)||0),0);
  const fixedCost=fixedCostMonthly*c.mo;
  const totalCost=teachCost+fixedCost;
  const d=st.disc/100,a=st.agent/100,u=st.uni/100;
  const afterDisc=totalFee*(1-d);
  const agentPS=c.fee*a,uniPS=c.fee*u;
  const netClean=afterDisc-agentPS-uniPS+c.app;
  const totalNet=netClean+otherFees;
  const beStu=totalNet>0?Math.ceil(totalCost/totalNet):999;
  const pGross=st.plan*totalFee,pNetClean=st.plan*netClean,pOther=st.plan*otherFees;
  const pTotal=st.plan*totalNet,pProfit=pTotal-totalCost;
  const pMgn=pTotal>0?pProfit/pTotal:0;
  const ad=st.aDisc/100,aa=st.aAgent/100,au=st.aUni/100;
  const aGross=st.act*totalFee,aDiscAmt=aGross*ad;
  const aAgentAmt=c.fee*st.act*aa,aUniAmt=c.fee*st.act*au;
  const aApp=st.act*c.app,aNetClean=aGross-aDiscAmt-aAgentAmt-aUniAmt+aApp;
  const aOther=st.act*otherFees,aTotal=aNetClean+aOther;
  const aProfit=aTotal-totalCost,aMgn=aTotal>0?aProfit/aTotal:0;
  const DR=[0,10,20,30,40],AR=[20,30,40,50];
  const sens=DR.map(dv=>AR.map(av=>{
    const n=totalFee*(1-dv/100)-c.fee*(av/100)-c.fee*u+c.app+otherFees;
    return n>0?Math.ceil(totalCost/n):"—";
  }));
  const ulecTeach=st.tf*c.hrs*(st.cp/100),ulecMgmtTotal=st.ulecMgmt*c.mo;
  const ulecTotal=ulecTeach+ulecMgmtTotal;
  const revPool=st.plan*(totalFee*(1-d)-c.fee*a);
  const uccProfit=revPool-ulecTotal,uccMgn=revPool>0?uccProfit/revPool:0;
  const ulecShare=revPool>0?ulecTotal/revPool:0;
  return{c,totalFee,otherFees,teachCost,fixedCost,fixedCostMonthly,totalCost,
    afterDisc,agentPS,uniPS,netClean,totalNet,beStu,
    pGross,pNetClean,pOther,pTotal,pProfit,pMgn,
    aGross,aDiscAmt,aAgentAmt,aUniAmt,aApp,aNetClean,aOther,aTotal,aProfit,aMgn,
    varStu:st.act-st.plan,varBE:st.act-beStu,
    varRevG:aGross-pGross,varRevN:aTotal-pTotal,varProfit:aProfit-pProfit,varMgnPp:(aMgn-pMgn)*100,
    sens,DR,AR,ulecTeach,ulecMgmtTotal,ulecTotal,revPool,uccProfit,uccMgn,ulecShare};
}

function renderWhatIf(s,st){
  const c=s.c;
  const net=s.totalNet,cost=s.totalCost;
  // Build a readable ladder of student counts around breakeven / planned / actual
  const anchors=[s.beStu,st.plan,st.act].filter(n=>n>0);
  const hi=Math.max(...anchors,1)+Math.max(6,Math.round(s.beStu*0.6));
  const step=Math.max(1,Math.ceil(hi/12));
  let counts=[];
  for(let n=step;n<=hi;n+=step)counts.push(n);
  anchors.forEach(a=>counts.push(a));
  counts=[...new Set(counts)].filter(n=>n>0).sort((a,b)=>a-b);
  const rows=counts.map(n=>{
    const rev=n*net,profit=rev-cost,mgn=rev>0?profit/rev:0;
    const perMo=(n/c.mo).toFixed(1),profitMo=profit/c.mo;
    const isBE=n===s.beStu,isPlan=n===st.plan,isAct=n===st.act;
    const tags=[];
    if(isBE)tags.push(`<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--blue-100);color:var(--blue-700)">BREAKEVEN</span>`);
    if(isPlan)tags.push(`<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;background:#ede9fe;color:#6d28d9">PLANNED</span>`);
    if(isAct)tags.push(`<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--amber-100);color:var(--amber-800)">ACTUAL</span>`);
    const bg=isPlan?"background:#faf5ff":isBE?"background:var(--blue-50)":"";
    const pc=profit>=0?"var(--text-success)":"var(--text-danger)";
    return`<tr style="${bg}">
      <td style="padding:6px 10px;font-weight:600;font-size:13px;white-space:nowrap;text-align:right">${n}</td>
      <td style="padding:6px 10px;color:var(--text-muted);white-space:nowrap;text-align:right">${perMo}</td>
      <td style="padding:6px 10px;text-align:right;color:var(--text-secondary)">${sgd(rev)}</td>
      <td style="padding:6px 10px;text-align:right;color:var(--text-muted)">${sgd(cost)}</td>
      <td style="padding:6px 10px;text-align:right;font-weight:700;color:${pc}">${sgd(profit)}</td>
      <td style="padding:6px 10px;text-align:right;color:${mgn>=0.15?"var(--text-success)":mgn>=0?"var(--text-warning)":"var(--text-danger)"}">${fp(mgn)}</td>
      <td style="padding:6px 10px;text-align:right;color:${pc}">${sgd(profitMo)}</td>
      <td style="padding:6px 10px;white-space:nowrap">${tags.join(" ")}</td>
    </tr>`;
  }).join("");
  return`<div class="card">
    <div class="card-hdr"><div class="card-title">What-if: profit by number of students</div><span class="card-badge" style="background:var(--blue-100);color:var(--blue-700)">${sgd(net)} net / student</span></div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">Each row = a different enrolment level. Net revenue per student is fixed at <strong>${sgd(net)}</strong>, total cost is fixed at <strong>${sgd(cost)}</strong> for this run — so profit = students × ${sgd(net)} − ${sgd(cost)}. Your <strong>breakeven</strong>, <strong>planned</strong> and <strong>actual</strong> levels are tagged. Change "Planned students" in the left panel to move the planned row.</div>
    <div class="tbl-scroll"><table class="cptbl" style="min-width:520px">
      <thead><tr>
        <th style="text-align:right">Students<br><span style="font-weight:400;text-transform:none">(total cohort)</span></th>
        <th style="text-align:right">Per month<br><span style="font-weight:400;text-transform:none">(÷ ${c.mo} mo)</span></th>
        <th style="text-align:right">Net revenue</th>
        <th style="text-align:right">Total cost</th>
        <th style="text-align:right">Profit / (loss)</th>
        <th style="text-align:right">Margin</th>
        <th style="text-align:right">Profit / month</th>
        <th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderCompare(saved){
  if(!saved.length)return`<div class="card"><div style="color:var(--text-muted);text-align:center;padding:60px 20px;font-size:13px">No scenarios saved yet.<br>Configure and click <strong>Save scenario</strong> in the header.</div></div>`;
  const best=r=>saved.reduce((b,sc)=>sc[r]>b[r]?sc:b).name;
  const low=r=>saved.reduce((b,sc)=>sc[r]<b[r]?sc:b).name;
  const rows=saved.map((sc,i)=>`<tr>
    <td style="padding:5px 8px;font-weight:600;color:var(--text-accent);white-space:nowrap">${sc.name}</td>
    <td style="padding:5px 8px;color:var(--text-muted);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${sc.course}">${sc.course}</td>
    <td style="padding:5px 8px;text-align:right">${sc.disc}%</td>
    <td style="padding:5px 8px;text-align:right">${sc.agent}%</td>
    <td style="padding:5px 8px;text-align:right">${sc.plan}</td>
    <td style="padding:5px 8px;text-align:right;font-weight:600;color:var(--text-accent)">${sc.be}</td>
    <td style="padding:5px 8px;text-align:right">${sgd(sc.cost)}</td>
    <td style="padding:5px 8px;text-align:right;font-weight:600;color:var(${sc.profit>=0?"--text-success":"--text-danger"})">${sgd(sc.profit)}</td>
    <td style="padding:5px 8px;text-align:right;color:var(${sc.mgn>=0.15?"--text-success":"--text-warning"})">${fp(sc.mgn)}</td>
    <td style="padding:5px 8px;text-align:center"><button data-del="${i}" style="color:var(--text-danger);border:none;background:none;cursor:pointer;font-size:16px;padding:0;line-height:1">×</button></td>
  </tr>`).join("");
  const qcmp=saved.length>=2?`<div class="qcmp">
    <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em">Quick comparison</div>
    <div class="qcmpg" style="margin-top:8px">
      <div>Best margin: <strong style="color:var(--text-success)">${best("mgn")}</strong> (${fp(Math.max(...saved.map(s=>s.mgn)))})</div>
      <div>Lowest BE: <strong style="color:var(--text-accent)">${low("be")}</strong> (${Math.min(...saved.map(s=>s.be))} students)</div>
      <div>Highest profit: <strong style="color:var(--text-success)">${best("profit")}</strong> (${sgd(Math.max(...saved.map(s=>s.profit)))})</div>
      <div>Lowest cost: <strong style="color:var(--text-primary)">${low("cost")}</strong> (${sgd(Math.min(...saved.map(s=>s.cost)))})</div>
    </div>
  </div>`:"";
  return`<div class="card">
    <div class="card-hdr"><div class="card-title">Saved scenarios</div><span style="font-size:11px;color:var(--text-muted)">${saved.length} saved</span></div>
    <div style="overflow-x:auto">
      <table class="cptbl">
        <thead><tr>${["Scenario","Course","Disc","Agent","Plan","BE","Cost","Profit","Margin",""].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${qcmp}
    <button id="clearAll" style="margin-top:12px;font-size:11px;color:var(--text-danger);background:none;border:none;cursor:pointer">Clear all scenarios</button>
  </div>`;
}

        <label><input type="radio" name="fcSchol" value="20" ${st.fcSchol===20?"checked":""}> 20% off</label>
        <label><input type="radio" name="fcSchol" value="30" ${st.fcSchol===30?"checked":""}> 30% off</label>
      </div>
      <div style="margin-top:8px">
        ${Row("Course fee",sgd(c.fee),"")}
        ${schol>0?Row(`Scholarship (${st.fcSchol}% on course fee)`,"("+sgd(scholAmt)+")","bad"):""}
        ${schol>0?Row("Discounted course fee",sgd(discFee),"acc"):""}
        ${Row("Material fee",sgd(c.mat),"")}
        ${Row("Exam / assignment fee",sgd(c.exam),"")}
        ${Row("Admin fee",sgd(c.admin),"")}
        ${Row("Subtotal (excl. GST)",sgd(subtotal),"bold","",true)}

      <div class="fcsum" style="background:var(--bg-accent);margin-top:12px">

        <div style="font-size:26px;font-weight:700;color:var(--text-accent);letter-spacing:-.02em">${sgd(totalInclGST)}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">incl. 9% GST · ${c.hrs} hrs · ${c.mo} month${c.mo>1?"s":""}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-hdr"><div class="card-title">Instalment plan — ${c.mo} months</div></div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">Course fee spread over ${c.mo} monthly instalments. Other fees paid at enrolment.</div>

      <div style="font-size:11px;color:var(--text-muted);margin-bottom:5px">Model</div>
      <select id="aiModelSel" style="width:100%;font-size:12px;padding:5px">
        ${["gpt-4o-mini","gpt-4o","gpt-4-turbo","gpt-3.5-turbo"].map(m=>`<option value="${m}"${m===st.aiModel?" selected":""}>${m}</option>`).join("")}
      </select>
      ${!hasKey?`<div style="margin-top:8px;font-size:11px;color:var(--amber-800);background:var(--amber-100);padding:6px 8px;border-radius:6px">Enter your OpenAI API key above to enable the AI advisor.</div>`:""}
    </div>`:""}
    ${msgs.length===0&&!st.aiThinking?`
    <div class="ai-empty">
      <div style="font-size:24px;margin-bottom:8px">💬</div>
      Ask me anything about the current course financials
    </div>`:""}
    ${msgs.length===0?`
    <div class="ai-chips" id="aiChips">
      <button class="ai-chip" data-q="What's driving the breakeven number so high?">Why is breakeven high?</button>
      <button class="ai-chip" data-q="How can I improve the planned profit margin for this course?">Improve margins?</button>
      <button class="ai-chip" data-q="Is this overhead structure reasonable for a Singapore PE institution?">Is overhead OK?</button>
      <button class="ai-chip" data-q="What discount rate would you recommend to stay profitable with 15 students?">Best discount rate?</button>
    </div>`:""}
    <div class="ai-msgs" id="aiMsgs">
      ${msgs.map(m=>`
      <div class="ai-msg ${m.role}">
        <div class="ai-bubble">${m.content.replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")}</div>
      </div>`).join("")}
      ${st.aiThinking?`<div class="ai-msg assistant"><div class="ai-bubble" style="padding:10px 14px"><div class="ai-thinking"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div></div></div>`:""}
    </div>
    <div class="ai-input-row">
      <input type="text" id="aiInput" placeholder="Ask about this course's financials…" style="flex:1;font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--border)">
      <button id="aiSendBtn" class="ai-send-btn"${!hasKey?" disabled title='Add API key in ⚙ settings'":" title='Send (Enter)'"}>Send</button>
    </div>
  </div>
  <button id="aiFloatBtn" class="ai-float${st.aiOpen?" hidden":""}" title="Finance AI Advisor">💬</button>`;
}

function getSimContext(s,st){
  const c=s.c;
  return`You are a financial advisor embedded in United Ceres College's (UCC) course budget simulator. UCC is a Singapore private education institution (PEI).

Your role: Help staff understand, analyse, and improve course financials. Be concise, practical, and actionable. Use Singapore education context where relevant (CPE, EduTrust, FPS, GST 9%, agent-driven international student recruitment).

CURRENT SIMULATION STATE:
Course: ${c.name} (${c.abbr}) | Category: ${c.cat}
Duration: ${c.mo} months | Contact hours: ${c.hrs} hrs | Fee/hr: $${(c.fee/c.hrs).toFixed(2)}/hr

Fee structure (per student):
  Course fee: $${c.fee} | Material: $${c.mat} | Exam/Assign: $${c.exam} | Admin: $${c.admin}
  Total fee/student: $${s.totalFee} | Application fee: $${c.app}

Cost structure (per run):
  Teacher rate: $${st.tf}/hr | Contact hours used: ${st.cp}% of ${c.hrs} hrs
  Teaching cost: $${Math.round(s.teachCost)}
  Fixed overhead: $${Math.round(s.fixedCostMonthly)}/mo × ${c.mo} months = $${Math.round(s.fixedCost)}
  Total cost per run: $${Math.round(s.totalCost)}

Pricing / deductions:
  Discount: ${st.disc}% | Agent commission: ${st.agent}% (on course fee) | University commission: ${st.uni}%
  Net revenue/student (after all deductions): $${Math.round(s.totalNet)}

Financial outcomes (planned: ${st.plan} students):
  Breakeven: ${s.beStu} students | Gap to BE: ${st.plan-s.beStu} students
  Planned net revenue: $${Math.round(s.pTotal)} | Planned profit: $${Math.round(s.pProfit)} (${(s.pMgn*100).toFixed(1)}% margin)
  Profit/month: $${Math.round(s.pProfit/c.mo)}/mo

Actual (${st.act} students):
  Actual profit: $${Math.round(s.aProfit)} (${(s.aMgn*100).toFixed(1)}% margin) | Variance vs planned: $${Math.round(s.varProfit)}`;
}

async function sendToAI(userMsg,s,st){
  if(!ST.aiKey){
    return"Please add your OpenAI API key in ⚙ Settings to enable AI assistance.";
  }
  ST.aiMessages.push({role:"user",content:userMsg});
  const messages=[{role:"system",content:getSimContext(s,st)},...ST.aiMessages];
  try{
    const res=await fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+ST.aiKey},
      body:JSON.stringify({model:ST.aiModel||"gpt-4o-mini",messages,max_tokens:700,temperature:0.7})
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(err.error?.message||"API error "+res.status);
    }
    const data=await res.json();
    const reply=data.choices[0].message.content;
    ST.aiMessages.push({role:"assistant",content:reply});
    return reply;
  }catch(e){
    ST.aiMessages.pop();
    throw e;
  }
}

function render(){
  const s=calc(ST);
  const tabs=["overview","sensitivity","ulec","compare","pricelist","feecalc"];
  const tlbls=["Overview","Sensitivity","ULEC subcontract",`Scenarios (${ST.saved.length})`,"Price List","Fee Calculator"];
  document.getElementById("app").innerHTML=`
  <div class="hdr">
    <div class="hdr-brand">
      <div class="hdr-label">United Ceres College</div>
      <div class="hdr-title">Course Budget Simulator</div>
    </div>
    <div class="hdr-actions">
      <input id="sName" placeholder="Scenario name…" value="${ST.sName}">
      <button id="saveSc" class="hdr-btn primary">Save</button>
      <button id="exportBtn" class="hdr-btn" title="Export all data as JSON">⬇ Export</button>
      <label class="hdr-btn" style="cursor:pointer" title="Import data from JSON">⬆ Import<input id="importFile" type="file" accept=".json" style="display:none"></label>
    </div>
  </div>
  <div class="subhdr">
    <span class="course-label">Course</span>
    <select id="coursesel">${buildCourseSelector(ST.ci)}</select>
    <div class="kpi-bar">${buildKPIBar(s,ST)}</div>
  </div>
  <div class="body">
    <div class="lp">${buildLP(ST)}</div>
    <div class="rp">
      <div class="tabs-wrap">
        <div class="tabs">${tabs.map((t,i)=>`<button class="tab${ST.tab===t?" on":""}" data-tab="${t}">${tlbls[i]}</button>`).join("")}</div>
      </div>
      <div id="rpcontent">${
        ST.tab==="overview"?renderOverview(s,ST):
        ST.tab==="sensitivity"?renderSens(s,ST):
        ST.tab==="ulec"?renderULEC(s,ST):
        ST.tab==="compare"?renderCompare(ST.saved):
        ST.tab==="pricelist"?renderPriceList():
        renderFeeCalc(ST)
      }</div>
    </div>
  </div>
  ${buildAIPanel(ST)}`;
  bindEvents(s);
  if(ST.aiOpen){const msgs=document.getElementById("aiMsgs");if(msgs)msgs.scrollTop=msgs.scrollHeight;}
}

function bindEvents(s){
  const save_render=()=>{saveToStorage();render();};

  document.getElementById("coursesel").addEventListener("change",e=>{ST.ci=parseInt(e.target.value);save_render();});
  document.getElementById("sName").addEventListener("input",e=>{ST.sName=e.target.value;});
  document.getElementById("saveSc").addEventListener("click",()=>{
    const c=COURSES[ST.ci],sc=calc(ST);
    const name=ST.sName.trim()||`${c.abbr} — ${new Date().toLocaleDateString("en-GB")}`;
    ST.saved.push({name,course:c.name,disc:ST.disc,agent:ST.agent,plan:ST.plan,be:sc.beStu,cost:sc.totalCost,netRev:sc.pTotal,profit:sc.pProfit,mgn:sc.pMgn});
    ST.sName="";save_render();
  });
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",e=>{ST.tab=e.target.dataset.tab;save_render();}));
  const nums=["disc","agent","uni","tf","cp","plan","act","aDisc","aAgent","aUni"];
  nums.forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("change",e=>{ST[id]=parseFloat(e.target.value)||0;save_render();});});
  const ulec=document.getElementById("ulecMgmt");
  if(ulec)ulec.addEventListener("change",e=>{ST.ulecMgmt=parseFloat(e.target.value)||0;save_render();});
  document.querySelectorAll("[data-oh]").forEach(inp=>inp.addEventListener("change",e=>{ST.oh[parseInt(e.target.dataset.oh)].cost=parseFloat(e.target.value)||0;save_render();}));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",e=>{ST.saved.splice(parseInt(e.target.dataset.del),1);save_render();}));
  const ca=document.getElementById("clearAll");if(ca)ca.addEventListener("click",()=>{ST.saved=[];save_render();});
  const fcSel=document.getElementById("fcCoursesel");if(fcSel)fcSel.addEventListener("change",e=>{ST.fcCi=parseInt(e.target.value);save_render();});
  document.querySelectorAll("input[name='fcSchol']").forEach(r=>r.addEventListener("change",e=>{ST.fcSchol=parseInt(e.target.value);save_render();}));
  document.querySelectorAll("[data-pci]").forEach(inp=>inp.addEventListener("change",e=>{
    const i=parseInt(e.target.dataset.pci),field=e.target.dataset.pf;
    COURSES[i][field]=parseFloat(e.target.value)||0;save_render();
  }));
  const rp=document.getElementById("resetPrices");if(rp)rp.addEventListener("click",()=>{DEFAULTS.forEach((d,i)=>{COURSES[i].fee=d.fee;COURSES[i].mat=d.mat;COURSES[i].exam=d.exam;COURSES[i].admin=d.admin;COURSES[i].hrs=d.hrs;COURSES[i].mo=d.mo;});save_render();});
  document.getElementById("exportBtn").addEventListener("click",exportData);
  document.getElementById("importFile").addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);});

  /* LP section toggles */
  document.querySelectorAll("[data-lpsec]").forEach(btn=>btn.addEventListener("click",e=>{
    const k=e.currentTarget.dataset.lpsec;
    ST.lpSections[k]=!ST.lpSections[k];
    saveToStorage();
    const body=btn.nextElementSibling;
    const caret=btn.querySelector(".lp-sec-caret");
    body.classList.toggle("hidden",!ST.lpSections[k]);
    caret.classList.toggle("open",ST.lpSections[k]);
  }));

  /* AI panel */
  const floatBtn=document.getElementById("aiFloatBtn");
  const closeBtn=document.getElementById("aiCloseBtn");
  const settingsBtn=document.getElementById("aiSettingsBtn");
  const clearBtn=document.getElementById("aiClearBtn");
  const sendBtn=document.getElementById("aiSendBtn");
  const aiInput=document.getElementById("aiInput");
  const keyInp=document.getElementById("aiKeyInput");
  const modelSel=document.getElementById("aiModelSel");

  if(floatBtn)floatBtn.addEventListener("click",()=>{ST.aiOpen=true;render();});
  if(closeBtn)closeBtn.addEventListener("click",()=>{ST.aiOpen=false;save_render();});
  if(settingsBtn)settingsBtn.addEventListener("click",()=>{ST.aiSettingsOpen=!ST.aiSettingsOpen;render();});
  if(clearBtn)clearBtn.addEventListener("click",()=>{ST.aiMessages=[];ST.aiThinking=false;render();});
  if(keyInp)keyInp.addEventListener("change",e=>{ST.aiKey=e.target.value.trim();save_render();});
  if(modelSel)modelSel.addEventListener("change",e=>{ST.aiModel=e.target.value;save_render();});

  document.querySelectorAll(".ai-chip").forEach(c=>c.addEventListener("click",e=>doAISend(e.target.dataset.q,s)));
  if(aiInput){
    aiInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doAISend(aiInput.value,s);}});
  }
  if(sendBtn)sendBtn.addEventListener("click",()=>{if(aiInput)doAISend(aiInput.value,s);});
}

async function doAISend(msg,s){
  msg=(msg||"").trim();
  if(!msg)return;
  const inp=document.getElementById("aiInput");
  if(inp)inp.value="";
  ST.aiThinking=true;
  render();
  try{
    await sendToAI(msg,s,ST);
  }catch(e){
    ST.aiMessages.push({role:"assistant",content:"Error: "+e.message});
  }
  ST.aiThinking=false;
  render();
  const msgs=document.getElementById("aiMsgs");
  if(msgs)msgs.scrollTop=msgs.scrollHeight;
}

function init(){loadFromStorage();render();}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init);}else{init();}
</script>
</body>
